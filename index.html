<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Charcutier — In-store space leasing</title>
<style>
  :root {
    --bg: #F3F4EE;
    --surface: #FFFFFF;
    --surface-2: #EBEBE1;
    --border: #DBDACB;
    --ink: #16231B;
    --ink-soft: #566056;
    --ink-faint: #8B937E;
    --primary: #2E6B4E;
    --primary-dark: #204C38;
    --primary-ink: #F6F8F1;
    --accent: #DE9A2E;
    --accent-ink: #201400;
    --danger: #BD4128;
    --danger-bg: #FBE8E1;
    --warn: #C4871B;
    --warn-bg: #FBEFD9;
    --good-bg: #E4EFE2;
    --bulk-res: #B0700A; --bulk-res-bg: #FCF0DA; --bulk-res-ink: #6E4500;
    --bulk-add: #2C6E8F; --bulk-add-bg: #E1EEF5; --bulk-add-ink: #1B4A63;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --font-display: 'Times New Roman', Times, serif;
    --font-body: 'Times New Roman', Times, serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #12160F;
      --surface: #1A2018;
      --surface-2: #202721;
      --border: #313A2E;
      --ink: #EDEFE6;
      --ink-soft: #AAB4A1;
      --ink-faint: #737E6C;
      --primary: #5FA982;
      --primary-dark: #7CC49C;
      --primary-ink: #0D1710;
      --accent: #E7AC49;
      --accent-ink: #1B1200;
      --danger: #E17456;
      --danger-bg: #3A2019;
      --warn: #E0B24F;
      --warn-bg: #3A2E14;
      --good-bg: #223328;
      --bulk-res: #E0B24F; --bulk-res-bg: #3A2E14; --bulk-res-ink: #F3D48C;
      --bulk-add: #5AA9CF; --bulk-add-bg: #17303D; --bulk-add-ink: #A9D6EE;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12160F;
    --surface: #1A2018;
    --surface-2: #202721;
    --border: #313A2E;
    --ink: #EDEFE6;
    --ink-soft: #AAB4A1;
    --ink-faint: #737E6C;
    --primary: #5FA982;
    --primary-dark: #7CC49C;
    --primary-ink: #0D1710;
    --accent: #E7AC49;
    --accent-ink: #1B1200;
    --danger: #E17456;
    --danger-bg: #3A2019;
    --warn: #E0B24F;
    --warn-bg: #3A2E14;
    --good-bg: #223328;
    --bulk-res: #E0B24F; --bulk-res-bg: #3A2E14; --bulk-res-ink: #F3D48C;
    --bulk-add: #5AA9CF; --bulk-add-bg: #17303D; --bulk-add-ink: #A9D6EE;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; font-weight: 800; font-style: italic; }
  a { color: inherit; }

  #app { min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
  .brand .mark {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px; background: var(--primary);
    color: var(--primary-ink); font-family: var(--font-display); font-weight: 800; font-size: 13px; letter-spacing: -0.02em;
  }
  .brand .name { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .brand .sub { font-size: 12px; color: var(--ink-faint); display: none; }
  @media (min-width: 720px) { .brand .sub { display: inline; } }

  .tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
  .tab-btn {
    border: none; background: transparent; padding: 7px 16px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  }
  .tab-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .topbar-spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
  .backup-dot { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--surface); }
  .backup-dot.warn { background: var(--warn); }
  .backup-dot.bad { background: var(--danger); }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .gallery-thumb { cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); }
  .gallery-thumb img { width: 100%; height: 90px; object-fit: cover; display: block; }
  .gallery-caption { font-size: 11px; color: var(--ink-soft); padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Layout ---------- */
  .body-grid { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 230px; flex-shrink: 0; border-right: 1px solid var(--border);
    padding: 16px 12px; display: none; overflow-y: auto;
  }
  @media (min-width: 860px) { .sidebar { display: block; } }
  .sidebar h3 {
    font-size: 11px; text-transform: none; color: var(--ink-faint);
    font-family: var(--font-body); font-weight: 600; padding: 6px 10px 4px;
  }
  .branch-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13.5px; color: var(--ink-soft);
  }
  .branch-item:hover { background: var(--surface-2); }
  .branch-item.active { background: var(--good-bg); color: var(--primary-dark); font-weight: 600; }
  .branch-item .count { font-size: 11.5px; color: var(--ink-faint); }
  .branch-item.active .count { color: var(--primary-dark); opacity: .75; }

  .main { flex: 1; min-width: 0; padding: 18px 20px 60px; overflow-y: auto; }
  .main-inner { max-width: 1180px; margin: 0 auto; }

  /* ---------- KPIs ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 22px; }
  @media (min-width: 640px) { .kpi-row { grid-template-columns: repeat(4, 1fr); } }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 14px 12px;
  }
  .kpi .num { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .kpi .label { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .kpi.accent .num { color: var(--accent); }
  .kpi.danger .num { color: var(--danger); }

  h2.section-title { font-size: 16px; margin: 26px 0 10px; }
  .main-inner > h2.section-title:first-child { margin-top: 0; }

  /* ---------- Occupancy bars ---------- */
  .occ-list { display: flex; flex-direction: column; gap: 8px; }
  .occ-row { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 56px; align-items: center; gap: 10px; font-size: 13px; }
  .occ-name { color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; min-width: 0; }
  .occ-name:hover { color: var(--primary); }
  .occ-bar-track { height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; min-width: 40px; }
  .occ-bar-fill { height: 100%; background: var(--primary); border-radius: 5px; }
  .occ-pct { text-align: right; color: var(--ink-faint); font-size: 12px; white-space: nowrap; }

  /* ---------- Expiring list ---------- */
  .expiring-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .expiring-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .expiring-row:last-child { border-bottom: none; }
  .expiring-row .who { font-weight: 600; }
  .expiring-row .where { color: var(--ink-faint); font-size: 12px; }
  .expiring-row .when { margin-left: auto; font-size: 12.5px; }
  .empty-note { padding: 20px; text-align: center; color: var(--ink-faint); font-size: 13.5px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }

  /* ---------- Filter bar ---------- */
  .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .space-actions { display: flex; flex-wrap: nowrap; gap: 8px; }
  .space-actions .btn { white-space: nowrap; }
  .chip-group { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex-wrap: wrap; }
  .chip {
    border: none; background: transparent; padding: 6px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .kind-chip {
    border: 1px solid var(--border); background: var(--bg); color: var(--ink-soft);
    padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .kind-chip.active { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  select.filter-select, input.filter-input {
    border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm);
    padding: 7px 10px; font-size: 13px;
  }
  input.filter-input { min-width: 160px; }
  .filter-bar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink);
    padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.bulk-res { background: var(--bulk-res-bg); border-color: var(--bulk-res); color: var(--bulk-res-ink); }
  .btn.bulk-add { background: var(--bulk-add-bg); border-color: var(--bulk-add); color: var(--bulk-add-ink); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- Table ---------- */
  .table-wrap { position: relative; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-wrap.scroll-fade::after {
    content: ""; position: absolute; top: 1px; right: 1px; bottom: 1px; width: 26px;
    background: linear-gradient(to right, transparent, var(--surface) 80%);
    pointer-events: none;
  }
  table { width: 100%; border-collapse: collapse; min-width: 760px; table-layout: fixed; }
  table col.col-space { width: 15%; }
  table col.col-code { width: 6%; }
  table col.col-size { width: 8%; }
  table col.col-type { width: 8%; }
  table col.col-status { width: 9%; }
  table col.col-exec { width: 8%; }
  table col.col-supplier { width: 13%; }
  table col.col-period { width: 11%; }
  table col.col-price { width: 11%; }
  table col.col-actions { width: 11%; }
  thead th {
    text-align: left; font-size: 11.5px; color: var(--ink-faint); font-weight: 700; font-family: var(--font-display); font-style: italic;
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2);
    white-space: nowrap;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.branch-start td { border-top: 4px solid var(--ink-faint); }
  tbody tr.branch-alt td { background: var(--surface-2); }
  tbody tr.branch-alt:hover td { background: var(--surface); }
  tbody tr:hover { background: var(--surface-2); }
  .cell-space { display: flex; flex-direction: column; min-width: 0; }
  .cell-space .code { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-space .branch { font-size: 11.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-pill {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .code-badge {
    display: inline-block; font-family: var(--font-display); font-size: 12px; font-weight: 700;
    letter-spacing: .02em; color: var(--ink-soft); background: var(--surface-2);
    padding: 2px 7px; border-radius: var(--radius-sm); white-space: nowrap;
  }
  .cat-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .cat-pill {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
    background: var(--good-bg); color: var(--primary-dark); white-space: nowrap;
  }
  .chips-input {
    display: flex; flex-wrap: wrap; gap: 6px; min-height: 0;
  }
  .chips-input:empty { display: none; }
  .cat-chip {
    display: inline-flex; align-items: center; gap: 5px; background: var(--good-bg); color: var(--primary-dark);
    font-size: 12.5px; font-weight: 600; padding: 4px 6px 4px 10px; border-radius: 999px;
  }
  .chip-x {
    border: none; background: transparent; color: inherit; opacity: .6; cursor: pointer; font-size: 13px;
    line-height: 1; padding: 0 2px;
  }
  .chip-x:hover { opacity: 1; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .status-pill.available { background: var(--good-bg); color: var(--primary-dark); }
  .status-pill.upcoming { background: var(--surface-2); color: var(--ink-soft); }
  .status-pill.active { background: var(--good-bg); color: var(--primary-dark); }
  .status-pill.expiring { background: var(--warn-bg); color: var(--warn); }
  .status-pill.expired { background: var(--danger-bg); color: var(--danger); }
  @keyframes flashy-yellow {
    0%, 100% { background-color: rgba(234, 179, 8, 0.18); }
    50% { background-color: rgba(234, 179, 8, 0.55); }
  }
  tr.row-expired td { animation: flashy-yellow 1.4s ease-in-out infinite; }
  .remove-notice { display: block; margin-top: 3px; font-size: 10.5px; font-weight: 700; color: #92400e; white-space: nowrap; }
  .exec-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); }
  .exec-pill.due { background: var(--warn-bg); color: var(--warn); }
  .exec-pill.yes { background: var(--good-bg); color: var(--primary-dark); }
  .contract-pill { display: inline-block; margin-top: 3px; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
  .contract-pill.normal { background: var(--surface-2); color: var(--ink-faint); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .client-name { font-weight: 600; display: block; white-space: normal; overflow-wrap: break-word; word-break: break-word; }
  .period { color: var(--ink-soft); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .price { font-variant-numeric: tabular-nums; }
  .vat-sub { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
  .vat-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; min-height: 14px; font-variant-numeric: tabular-nums; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,14,9,.45); display: flex; align-items: flex-end;
    justify-content: center; z-index: 100; padding: 0;
  }
  @media (min-width: 640px) { .overlay { align-items: center; padding: 20px; } }
  .modal {
    background: var(--surface); width: 100%; max-width: 560px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    max-height: 88vh; overflow-y: auto; padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    border: 1px solid var(--border);
  }
  @media (min-width: 640px) { .modal { border-radius: var(--radius-lg); } }
  .modal h3 { font-size: 17px; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 12px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm);
    padding: 8px 10px; font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 38px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-close { position: absolute; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .x-btn { border: none; background: transparent; color: var(--ink-faint); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px; }

  .branch-manage-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .branch-manage-row:last-child { border-bottom: none; }
  .branch-manage-row input { flex: 1; }
  .history-row td { background: var(--surface-2); font-size: 12.5px; color: var(--ink-soft); }

  .toast {
    position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .loading-screen {
    display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--ink-faint); font-size: 14px;
  }
  .exit-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 10px; padding: 20px; text-align: center;
  }
  .exit-check {
    width: 56px; height: 56px; border-radius: 50%; background: var(--good-bg); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 6px;
  }
  .exit-screen h2 { font-size: 19px; margin: 0; }
  .exit-sub { color: var(--ink-faint); font-size: 13.5px; margin-bottom: 14px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
<link rel="icon" href="assets/logo.png">
</head>
<body>
<div id="app"><div class="loading-screen">Loading Le Charcutier…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="claude-shim.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
(function(){
  "use strict";

  var DEFAULT_TYPES = [
    { key: "GE", label: "Gondola End", expiringDays: 30 },
    { key: "Pillar", label: "Pillar", expiringDays: 30 },
    { key: "Branding", label: "Branding Space", expiringDays: 30 },
    { key: "Pyramid", label: "Pyramid", expiringDays: 30 }
  ];
  function typeLabel(k){
    var t = state.types[k];
    return t ? t.label : k;
  }
  function typeList(){
    return Object.keys(state.types).map(function(k){ return state.types[k]; }).sort(function(a,b){ return (a.order||0)-(b.order||0); });
  }

  var state = {
    branches: {},
    spaces: {},
    rentals: {},
    types: {},
    vatRate: null,
    lastBackupAt: null,
    supplierRefs: [],
    categoryRefs: [],
    brandRefs: [],
    privileges: {},
    archive: {},
    branchAccess: {},
    filters: { branch: "all", type: "all", status: "all", q: "" },
    archiveFilters: { branch: "all", q: "" },
    tab: "overview",
    expandedSpace: null,
    ready: false,
    exited: false
  };

  var dbApi = null;
  var assetsApi = null;
  var userApi = null;
  var downloadsApi = null;
  var mcpApi = null;
  var myId = null;
  var isAdminSession = true;
  var isOwnerSession = true;
  var restrictedBranchId = null;
  var pendingSelfNamePrompt = false;
  var isGlobalAdmin = true; // Owner/Editor AND not locked to one branch — the only ones who can touch whole-database actions
  var localMode = false;
  var LOCAL_KEY = "gondola_local_state_v1";

  // ---------------- persistence ----------------
  function loadLocal(){
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.branches = parsed.branches || {};
        state.spaces = parsed.spaces || {};
        state.rentals = parsed.rentals || {};
        state.vatRate = (typeof parsed.vatRate === "number") ? parsed.vatRate : null;
        state.lastBackupAt = parsed.lastBackupAt || null;
      }
    } catch(e) {}
  }
  function saveLocal(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({branches: state.branches, spaces: state.spaces, rentals: state.rentals, vatRate: state.vatRate, lastBackupAt: state.lastBackupAt})); } catch(e) {}
  }

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  // ---------------- seeding ----------------
  function defaultBranches(){
    var out = {};
    for (var i=1;i<=17;i++){
      var id = "b" + (i<10?"0"+i:i);
      out[id] = { id: id, name: "Branch " + (i<10?"0"+i:i), order: i };
    }
    return out;
  }
  function seedSpacesFor(branchId, branchOrder){
    var plan = [ ["GE",2], ["Pillar",1], ["Branding",2], ["Pyramid",1] ];
    var out = [];
    var bnum = String(branchOrder).padStart(2,"0");
    plan.forEach(function(p){
      for (var n=1;n<=p[1];n++){
        out.push({ id: uid("sp"), branchId: branchId, type: p[0], label: p[0] + " " + n, code: bnum + "-" + p[0].toUpperCase() + "-" + n });
      }
    });
    return out;
  }

  async function initDb(){
    try {
      if (!window.claude || !window.claude.use) { localMode = true; return; }
      dbApi = await window.claude.use("db");
      if (!dbApi) { localMode = true; return; }
    } catch(e) { localMode = true; return; }
  }

  async function seedIfEmpty(){
    if (localMode) {
      if (Object.keys(state.branches).length === 0) {
        state.branches = defaultBranches();
        var sp = {};
        Object.keys(state.branches).forEach(function(bid){
          seedSpacesFor(bid, state.branches[bid].order).forEach(function(s){ sp[s.id] = s; });
        });
        state.spaces = sp;
        saveLocal();
      }
      if (Object.keys(state.types).length === 0) {
        var ty = {};
        DEFAULT_TYPES.forEach(function(t, i){ ty[t.key] = { key: t.key, label: t.label, order: i+1, expiringDays: t.expiringDays }; });
        state.types = ty;
        saveLocal();
      }
      return;
    }
    try {
      var metaRef = dbApi.doc("meta/config");
      var snap = await metaRef.get();
      if (snap.exists && snap.data().seeded) return;
      var lease = await metaRef.acquire({ holder: "seed-" + Math.random().toString(36).slice(2), ttlMs: 15000 });
      if (!lease.acquired) return;
      var check = await metaRef.get();
      if (check.exists && check.data().seeded) return;
      var branches = defaultBranches();
      var branchIds = Object.keys(branches);
      for (var i=0;i<branchIds.length;i++){
        var b = branches[branchIds[i]];
        await dbApi.collection("branches").doc(b.id).set({ name: b.name, order: b.order });
      }
      for (var j=0;j<branchIds.length;j++){
        var spaces = seedSpacesFor(branchIds[j], branches[branchIds[j]].order);
        for (var k=0;k<spaces.length;k++){
          var s = spaces[k];
          await dbApi.collection("spaces").doc(s.id).set({ branchId: s.branchId, type: s.type, label: s.label, code: s.code });
        }
      }
      await metaRef.set({ seeded: true });
    } catch(e) { /* non-fatal */ }
  }

  async function seedTypesIfEmpty(){
    if (localMode) return;
    try {
      var metaRef = dbApi.doc("meta/types_config");
      var snap = await metaRef.get();
      if (snap.exists && snap.data().seeded) return;
      var lease = await metaRef.acquire({ holder: "seed-types-" + Math.random().toString(36).slice(2), ttlMs: 15000 });
      if (!lease.acquired) return;
      var check = await metaRef.get();
      if (check.exists && check.data().seeded) return;
      for (var i=0;i<DEFAULT_TYPES.length;i++){
        var t = DEFAULT_TYPES[i];
        await dbApi.collection("types").doc(t.key).set({ key: t.key, label: t.label, order: i+1, expiringDays: t.expiringDays });
      }
      await metaRef.set({ seeded: true });
    } catch(e) { /* non-fatal */ }
  }

  function subscribeAll(){
    if (localMode) { state.ready = true; render(); return; }
    var pending = { branches: true, spaces: true, rentals: true, types: true };
    function checkReady(){
      if (!pending.branches && !pending.spaces && !pending.rentals && !pending.types) {
        state.ready = true;
      }
      render();
    }
    dbApi.collection("branches").onSnapshot(function(qs){
      var out = {};
      qs.docs.forEach(function(d){ out[d.id] = Object.assign({id:d.id}, d.data()); });
      state.branches = out; pending.branches = false; checkReady();
    }, function(){ pending.branches = false; checkReady(); });
    dbApi.collection("types").onSnapshot(function(qs){
      var out = {};
      qs.docs.forEach(function(d){ out[d.id] = Object.assign({id:d.id}, d.data()); });
      state.types = out; pending.types = false; checkReady();
    }, function(){ pending.types = false; checkReady(); });
    dbApi.collection("spaces").onSnapshot(function(qs){
      var out = {};
      qs.docs.forEach(function(d){ out[d.id] = Object.assign({id:d.id}, d.data()); });
      state.spaces = out; pending.spaces = false; checkReady();
    }, function(){ pending.spaces = false; checkReady(); });
    dbApi.collection("rentals").onSnapshot(function(qs){
      var out = {};
      qs.docs.forEach(function(d){ out[d.id] = Object.assign({id:d.id}, d.data()); });
      state.rentals = out; pending.rentals = false; checkReady();
    }, function(){ pending.rentals = false; checkReady(); });
    dbApi.collection("archive").onSnapshot(function(qs){
      var out = {};
      qs.docs.forEach(function(d){ out[d.id] = Object.assign({id:d.id}, d.data()); });
      state.archive = out;
      render();
    }, function(){ });
    dbApi.doc("refdata/suppliers").onSnapshot(function(snap){
      state.supplierRefs = (snap.exists && Array.isArray(snap.data().items)) ? snap.data().items : [];
      render();
    }, function(){ });
    dbApi.doc("refdata/categories").onSnapshot(function(snap){
      state.categoryRefs = (snap.exists && Array.isArray(snap.data().items)) ? snap.data().items : [];
      render();
    }, function(){ });
    dbApi.doc("meta/lastBackup").onSnapshot(function(snap){
      state.lastBackupAt = (snap.exists && snap.data().at) ? snap.data().at : null;
      render();
    }, function(){ });
    dbApi.doc("settings/vat").onSnapshot(function(snap){
      var v = snap.exists ? snap.data().rate : null;
      state.vatRate = (typeof v === "number" && isFinite(v) && v >= 0) ? v : null;
      render();
    }, function(){ });
    dbApi.doc("refdata/brands").onSnapshot(function(snap){
      state.brandRefs = (snap.exists && Array.isArray(snap.data().items)) ? snap.data().items : [];
      render();
    }, function(){ });
    dbApi.collection("privileges").onSnapshot(function(qs){
      var out = {};
      qs.docs.forEach(function(d){ out[d.id] = Object.assign({id:d.id}, d.data()); });
      state.privileges = out;
      render();
    }, function(){ });
    dbApi.collection("branchAccess").onSnapshot(function(qs){
      var out = {};
      qs.docs.forEach(function(d){ out[d.id] = Object.assign({id:d.id}, d.data()); });
      state.branchAccess = out;
      render();
    }, function(){ });
  }

    if (localMode){ if(state.types[key]) state.types[key].expiringDays=n; saveLocal(); render(); return; }
    try { await dbApi.doc("types/"+key).update({ expiringDays: n }); } catch(e){ toast("Couldn't update"); }
  }

  async function deleteBranch(id){
    var spaceIds = Object.keys(state.spaces).filter(function(k){ return state.spaces[k].branchId===id; });
    if (localMode){
      spaceIds.forEach(function(sid){ delete state.spaces[sid]; });
      Object.keys(state.rentals).forEach(function(rid){ if (state.rentals[rid].branchId===id) delete state.rentals[rid]; });
      delete state.branches[id]; saveLocal(); render(); return;
    }
    try {
      for (var i=0;i<spaceIds.length;i++){ await deleteSpace(spaceIds[i], true); }
      await dbApi.doc("branches/"+id).delete();
    } catch(e){ toast("Couldn't delete branch"); }
  }

  async function deleteSpace(id, skipConfirm){
    var rentalIds = Object.keys(state.rentals).filter(function(k){ return state.rentals[k].spaceId===id; });
    var archiveIds = Object.keys(state.archive).filter(function(k){ return state.archive[k].spaceId===id; });
    var photoId = state.spaces[id] ? state.spaces[id].photoId : null;
    if (localMode){
      rentalIds.forEach(function(rid){ delete state.rentals[rid]; });
      archiveIds.forEach(function(aid){ delete state.archive[aid]; });
      delete state.spaces[id]; saveLocal(); if(!skipConfirm) render(); return;
    }
    try {
      for (var i=0;i<rentalIds.length;i++){ await dbApi.doc("rentals/"+rentalIds[i]).delete(); }
      for (var j=0;j<archiveIds.length;j++){ await dbApi.doc("archive/"+archiveIds[j]).delete(); }
      await dbApi.doc("spaces/"+id).delete();
      if (assetsApi && photoId){ try { await assetsApi.delete(photoId); } catch(e) {} }
    } catch(e){ toast("Couldn't delete space"); }
  }

  function sanitizeRentalBody(body){
    var out = {};
    out.supplier = String(body.supplier||"").slice(0, 200);
    out.brands = Array.isArray(body.brands) ? body.brands.map(function(b){ return String(b||"").trim(); }).filter(Boolean).slice(0, 50) : [];
    out.categories = Array.isArray(body.categories) ? body.categories.map(function(c){ return String(c||"").trim(); }).filter(Boolean).slice(0, 50) : [];
    var sd = String(body.startDate||"").trim();
    var ed = String(body.endDate||"").trim();
    out.startDate = /^\d{4}-\d{2}-\d{2}$/.test(sd) ? sd : todayStr();
    out.endDate = /^\d{4}-\d{2}-\d{2}$/.test(ed) ? ed : out.startDate;
    var priceNum = Number(body.price);
    out.price = (isFinite(priceNum) && priceNum>=0) ? Math.min(priceNum, 100000000) : 0;
    out.notes = String(body.notes||"").slice(0, 2000);
    out.executed = !!body.executed;
    out.removed = !!body.removed;
    out.rentalType = body.rentalType==="contractual" ? "contractual" : "normal";
    if (body.spaceId!==undefined) out.spaceId = String(body.spaceId||"");
    if (body.branchId!==undefined) out.branchId = String(body.branchId||"");
    if (body.createdAt!==undefined) out.createdAt = body.createdAt;
    if (body.bulkId) out.bulkId = String(body.bulkId);
    if (body.lastEditedBy!==undefined) out.lastEditedBy = String(body.lastEditedBy||"").slice(0,80);
    if (body.lastEditedAt!==undefined) out.lastEditedAt = body.lastEditedAt;
    return out;
  }

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function fmtDate(d){ if(!d) return "—"; var dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
  function fmtDateCompact(d){
    if (!d) return "—";
    var dt = new Date(d+"T00:00:00");
    var day = String(dt.getDate()).padStart(2,"0");
    var mon = dt.toLocaleDateString(undefined,{month:"short"});
    return day + "-" + mon + "-" + dt.getFullYear();
  }
  async function generateRentalPdf(formEl){
    if (!downloadsApi){ toast("Downloads aren't available in this view"); return; }
    if (typeof window.jspdf==="undefined"){ toast("Couldn't load the PDF library — try again"); return; }
    var supplier = (formEl.querySelector('[name="supplier"]')||{}).value || "";
    var brands = Array.from(formEl.querySelectorAll('[name="brands"]')).map(function(i){ return i.value; }).filter(Boolean);
    var cats = Array.from(formEl.querySelectorAll('[name="categories"]')).map(function(i){ return i.value; }).filter(Boolean);
    var startDate = (formEl.querySelector('[name="startDate"]')||{}).value || "";
    var endDate = (formEl.querySelector('[name="endDate"]')||{}).value || "";
    var priceRaw = (formEl.querySelector('[name="price"]')||{}).value || "0";
    var price = Number(priceRaw) || 0;
    var typeSelect = formEl.querySelector('#rental-type-select');
    var typeHidden = formEl.querySelector('[name="rentalType"]');
    var rentalType = typeSelect ? typeSelect.value : (typeHidden ? typeHidden.value : "normal");
    var executed = (formEl.querySelector('[name="executed"]')||{}).value === "yes";
    var removed = (formEl.querySelector('[name="removed"]')||{}).value === "yes";
    var notes = (formEl.querySelector('[name="notes"]')||{}).value || "";
    var spaceId = formEl.getAttribute('data-space');
    var sp = state.spaces[spaceId];
    var br = sp ? state.branches[sp.branchId] : null;
    var vp = vatParts(price);

    try {
      var doc = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      var pageWidth = doc.internal.pageSize.getWidth();
      var margin = 18;
      var y = 22;

      doc.setFont("helvetica", "bold"); doc.setFontSize(18);
      doc.text("Rental Confirmation", margin, y);
      y += 6;
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(110,110,110);
      doc.text("Le Charcutier — In-store space leasing", margin, y);
      doc.setTextColor(0,0,0);
      y += 4;
      doc.setDrawColor(200,200,200);
      doc.line(margin, y, pageWidth-margin, y);
      y += 10;

      var rows = [
        ["Branch", br ? branchDisplay(br) : "—"],
        ["Space", sp ? sp.label : "—"],
        ["Space code", sp && sp.code ? sp.code : "—"],
        ["Display type", sp ? typeLabel(sp.type) : "—"],
        ["Supplier", supplier || "—"],
        ["Brand(s)", brands.length ? brands.join(", ") : "—"],
        ["Categories", cats.length ? cats.join(", ") : "—"],
        ["Rental type", rentalType==="contractual" ? "Contractual (annual)" : "Normal"],
        ["Start date", fmtDate(startDate)],
        ["End date", fmtDate(endDate)],
        ["Monthly price (excl. VAT)", fmtMoney2(price)],
        ["VAT rate", fmtRate(vatRate())],
        ["VAT amount", fmtMoney2(vp.vat)],
        ["Monthly price (incl. VAT)", fmtMoney2(vp.gross)],
        ["Executed?", executed ? "Yes" : "No"],
        ["Removed?", removed ? "Yes" : "No"]
      ];

      var labelX = margin, valueX = margin + 58;
      rows.forEach(function(row){
        doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(90,90,90);
        doc.text(row[0], labelX, y);
        doc.setFont("helvetica", "normal"); doc.setTextColor(20,20,20);
        var valueLines = doc.splitTextToSize(String(row[1]), pageWidth - margin - valueX);
        doc.text(valueLines, valueX, y);
        y += 7 * Math.max(1, valueLines.length);
      });

      y += 3;
      doc.setDrawColor(200,200,200);
      doc.line(margin, y, pageWidth-margin, y);
      y += 9;
      doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(90,90,90);
      doc.text("Notes", labelX, y);
      doc.setFont("helvetica", "normal"); doc.setTextColor(20,20,20);
      var noteLines = doc.splitTextToSize(notes || "—", pageWidth - margin - valueX);

  // ---------------- VAT ----------------
  // Prices are entered EXCLUDING VAT; VAT is added on top at the current rate (a percentage).
  // Everything that shows VAT goes through vatParts(), so changing the rule later means editing one function.
  var DEFAULT_VAT = 11;
  function vatRate(){
    return (state.vatRate === null || state.vatRate === undefined || !isFinite(Number(state.vatRate))) ? DEFAULT_VAT : Number(state.vatRate);
  }
  function fmtRate(r){ return String(+Number(r).toFixed(2)) + "%"; }
  function vatParts(price){
    var p = Number(price || 0);
    var netC = Math.round(p * 100);
    var vatC = Math.round(p * vatRate());          // p dollars × rate% = p×rate cents
    return { net: netC/100, vat: vatC/100, gross: (netC+vatC)/100, netC: netC, vatC: vatC };
  }
  function fmtMoney2(n){
    n = Number(n || 0);
    var whole = Math.abs(n - Math.round(n)) < 0.005;

  }

  }

  function rentalsForSpace(spaceId){
    return Object.values(state.rentals).filter(function(r){ return r.spaceId===spaceId; });
  }

  function spaceStatus(spaceId){
    var today = todayStr();
    var sp = state.spaces[spaceId];
    var rs = rentalsForSpace(spaceId);
    if (rs.length===0) return { status: "available", rental: null };
    var current = rs.find(function(r){ return r.startDate<=today && r.endDate>=today; });
    if (current){
      var left = daysBetween(today, current.endDate);
      var threshold = (sp && state.types[sp.type] && typeof state.types[sp.type].expiringDays==="number") ? state.types[sp.type].expiringDays : 30;
      return { status: left<=threshold ? "expiring" : "active", rental: current, daysLeft: left };
    }
    var upcoming = rs.filter(function(r){ return r.startDate>today; }).sort(function(a,b){ return a.startDate<b.startDate?-1:1; })[0];
    if (upcoming) return { status: "upcoming", rental: upcoming };
    var past = rs.filter(function(r){ return r.endDate<today; }).sort(function(a,b){ return a.endDate>b.endDate?-1:1; })[0];
    if (past) return { status: "expired", rental: past };
    return { status: "available", rental: null };
  }

  function isCodeTaken(code, excludeSpaceId){
    var c = (code||"").trim().toUpperCase();
    if (!c) return false;
    return spaceList().some(function(s){ return s.id!==excludeSpaceId && (s.code||"").trim().toUpperCase()===c; });
  }
  function generateSpaceCode(branchId, label, excludeId){
    var b = state.branches[branchId];
    var bcode = (b && b.code ? b.code : (b && b.name ? b.name.slice(0,2) : "")).toUpperCase();
    var prefix = (label||"").trim().slice(0,2).toUpperCase();
    var base = bcode + prefix;
    var used = spaceList()
      .filter(function(s){ return s.id!==excludeId && (s.code||"").toUpperCase().indexOf(base)===0; })
      .map(function(s){ var n = parseInt((s.code||"").slice(base.length), 10); return isNaN(n) ? 0 : n; });
    var next = (used.length ? Math.max.apply(null, used) : 0) + 1;
    var candidate = base + next;
    while (isCodeTaken(candidate, excludeId)) { next++; candidate = base + next; }
    return candidate;
  }

  // Plan several codes at once, using the same rule as generateSpaceCode, while also avoiding codes
  // already planned earlier in the same batch (so two rows sharing a label prefix never collide).
  function nextCodesFor(branchId, label, count, planned){
    var b = state.branches[branchId];
    var bcode = (b && b.code ? b.code : (b && b.name ? b.name.slice(0,2) : "")).toUpperCase();
    var prefix = (label||"").trim().slice(0,2).toUpperCase();
    var base = bcode + prefix;
    var taken = {};
    spaceList().forEach(function(sp){ var c = (sp.code||"").trim().toUpperCase(); if (c) taken[c] = true; });
    planned.forEach(function(c){ taken[c] = true; });
    var maxN = 0;
    Object.keys(taken).forEach(function(c){
      if (c.indexOf(base) === 0){ var n = parseInt(c.slice(base.length), 10); if (!isNaN(n) && n > maxN) maxN = n; }
    });
    var out = [], next = maxN;
    for (var i=0; i<count; i++){
      next++;
      var cand = base + next;
      while (taken[cand]) { next++; cand = base + next; }
      taken[cand] = true; planned.push(cand); out.push(cand);
    }
    return out;
  }

  function naturalCompare(a, b){
    a = String(a||""); b = String(b||"");
    var ax = a.match(/\d+|\D+/g) || [];
    var bx = b.match(/\d+|\D+/g) || [];
    var len = Math.max(ax.length, bx.length);
    for (var i=0;i<len;i++){
      var av = ax[i]||"", bv = bx[i]||"";
      var an = /^\d+$/.test(av), bn = /^\d+$/.test(bv);
      if (an && bn){
        var diff = parseInt(av,10) - parseInt(bv,10);
        if (diff!==0) return diff;
      } else {
        var cmp = av.localeCompare(bv);
        if (cmp!==0) return cmp;
      }
    }
    return 0;
  }

  function filteredSpaces(){
    var f = state.filters;
    var today = todayStr();
    return spaceList().filter(function(sp){
      if (f.branch!=="all" && sp.branchId!==f.branch) return false;
      if (f.type!=="all" && sp.type!==f.type) return false;
      var st = spaceStatus(sp.id);
      if (f.status==="notExecuted"){ if (!needsExecution(st)) return false; }
      else if (f.status==="contractual"){ if (!st.rental || st.rental.rentalType!=="contractual") return false; }
      else if (f.status==="normalRental"){ if (!st.rental || st.rental.rentalType==="contractual") return false; }
      else if (f.status!=="all" && st.status!==f.status) return false;
      if (f.q){
        var q = f.q.toLowerCase();
        var client = st.rental ? supplierOf(st.rental).toLowerCase() + " " + brandOf(st.rental).toLowerCase() : "";
        var label = (sp.label||"").toLowerCase();
        var code = (sp.code||"").toLowerCase();
        var bname = (state.branches[sp.branchId]?state.branches[sp.branchId].name:"").toLowerCase();
        if (client.indexOf(q)===-1 && label.indexOf(q)===-1 && code.indexOf(q)===-1 && bname.indexOf(q)===-1) return false;
      }
      return true;
    }).sort(function(a,b){
      var ba = state.branches[a.branchId], bb = state.branches[b.branchId];
      var oa = ba?ba.order:0, ob = bb?bb.order:0;
      if (oa!==ob) return oa-ob;
      var byLabel = naturalCompare(a.label, b.label);
      if (byLabel!==0) return byLabel;
      return naturalCompare(a.code, b.code);
    });
  }

  function kpis(){
    var all = restrictedBranchId ? spaceList().filter(function(sp){ return sp.branchId===restrictedBranchId; }) : spaceList();
    var total = all.length, occupied=0, available=0, expiringSoon=0;
    all.forEach(function(sp){
      var st = spaceStatus(sp.id);
      if (st.status==="active"||st.status==="expiring") { occupied++; }
      if (st.status==="expiring") expiringSoon++;
      if (st.status==="available") available++;
    });
    return { total: total, occupied: occupied, available: available, expiringSoon: expiringSoon };
  }

  function filteredArchive(){
    var f = state.archiveFilters;

    if (f.q){
      var q = f.q.toLowerCase();
      list = list.filter(function(r){
        var sp = state.spaces[r.spaceId];

        var hay = (supplierOf(r)+" "+brandOf(r)+" "+(sp?sp.label:"")+" "+(sp?sp.code||"":"")+" "+(b?b.name:"")).toLowerCase();

  function askConfirm(message, danger, okLabel, cancelLabel){
    return new Promise(function(resolve){
      var ov = document.createElement("div");
      ov.className = "overlay";
      ov.style.zIndex = "300";
      ov.innerHTML = '<div class="modal" style="max-width:360px;">' +
        '<div style="font-size:14.5px;color:var(--ink);margin-bottom:18px;line-height:1.5;">' + message + '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn secondary" data-confirm="cancel">' + (cancelLabel||"Cancel") + '</button>' +
          '<button type="button" class="btn ' + (danger===false?'':'danger') + '" data-confirm="ok">' + (okLabel||"Confirm") + '</button>' +
        '</div>' +
      '</div>';
      document.body.appendChild(ov);
      function finish(result){ ov.remove(); resolve(result); }
      ov.querySelector('[data-confirm="cancel"]').addEventListener("click", function(){ finish(false); });
      ov.querySelector('[data-confirm="ok"]').addEventListener("click", function(){ finish(true); });
      ov.addEventListener("click", function(e){ if (e.target===ov) finish(false); });
    });
  }

  }

  var BULK_ADD_MAX = 1000;

  function computeBulkAddPlan(p){
    var out = { items: [], perBranch: [], ready: false, hint: "" };
    var active = p.rows.filter(function(r){ return r.qty > 0; });
    if (!active.length){ out.hint = "Set a quantity for at least one type."; return out; }
    if (!p.branchIds.length){ out.hint = "Select at least one branch."; return out; }
    out.ready = true;
    var planned = [];
    var picked = {};
    p.branchIds.forEach(function(id){ picked[id] = true; });
    branchList().forEach(function(b){
      if (!picked[b.id]) return;
      var entry = { branch: b, spaces: [] };
      active.forEach(function(r){
        nextCodesFor(b.id, r.label.trim(), r.qty, planned).forEach(function(code){
          var it = { branch: b, type: r.type, label: r.label.trim(), size: (r.size||"").trim(), code: code };
          out.items.push(it); entry.spaces.push(it);
        });
      });
      out.perBranch.push(entry);
    });
    return out;
  }

  function readBulkAddParams(wrap){
    var rows = Array.from(wrap.querySelectorAll('.bulk-add-row')).map(function(row){
      var qty = parseInt(row.querySelector('.bulk-add-qty').value, 10);
      return {
        type: row.getAttribute('data-type'),
        label: typeLabel(row.getAttribute('data-type')),
        qty: (isNaN(qty) || qty < 0) ? 0 : qty,
        size: row.querySelector('.bulk-add-size').value || ""
      };
    });
    var branchIds = Array.from(wrap.querySelectorAll('input[name="baBranch"]:checked')).map(function(cb){ return cb.value; });
    return { rows: rows, branchIds: branchIds };
  }

  function refreshBulkAddPreview(wrap){
    syncBranchSelectAll(wrap, 'baBranch', '#bulkadd-branch-toggle', '#bulkadd-branch-count');
    var box = wrap.querySelector('#bulkadd-preview');
    var summary = wrap.querySelector('#bulkadd-summary');
    var btn = wrap.querySelector('#bulkadd-submit');
    if (!box) return;
    var plan = computeBulkAddPlan(readBulkAddParams(wrap));
    if (!plan.ready){
      box.innerHTML = '<div style="color:var(--ink-faint);padding:6px 0;">' + escapeHtml(plan.hint) + '</div>';
      if (summary) summary.textContent = "";
      if (btn) btn.textContent = "Create spaces";
      return;
    }
    box.innerHTML = plan.perBranch.map(function(e){
      return '<div style="padding:4px 0;"><strong>' + escapeHtml(branchDisplay(e.branch)) + '</strong> — ' + e.spaces.length + ' space' + (e.spaces.length===1?'':'s') +
        '<div style="color:var(--ink-faint);font-size:11.5px;word-break:break-word;">' + e.spaces.map(function(sp){ return escapeHtml(sp.code); }).join(', ') + '</div></div>';
    }).join('');
    var byType = {};
    plan.items.forEach(function(it){ byType[it.type] = (byType[it.type]||0) + 1; });
    var typeText = typeList().filter(function(t){ return byType[t.key]; }).map(function(t){ return t.label + ' ×' + byType[t.key]; }).join(', ');
    if (summary) summary.textContent = plan.items.length + ' space' + (plan.items.length===1?'':'s') + ' in ' + plan.perBranch.length + ' branch' + (plan.perBranch.length===1?'':'es') + ' — ' + typeText;
    if (btn) btn.textContent = 'Create ' + plan.items.length + ' space' + (plan.items.length===1?'':'s');
  }

  async function submitBulkAddSpaces(form){
    if (!isAdminSession) return;
    var wrap = form.closest('.overlay');
    var plan = computeBulkAddPlan(readBulkAddParams(wrap));
    if (!plan.ready){ toast(plan.hint); return; }
    var total = plan.items.length;
    if (total > BULK_ADD_MAX){ toast("That's " + total.toLocaleString() + " spaces — the most you can add in one batch is " + BULK_ADD_MAX.toLocaleString() + ". Lower the quantity or pick fewer branches."); return; }
    var projected = estimateDocCount() + total;
    if (projected > DOC_CAP){ toast("Not enough room: this would take the database to about " + projected.toLocaleString() + " of its " + DOC_CAP.toLocaleString() + "-document limit."); return; }

    var byType = {};
    plan.items.forEach(function(it){ byType[it.type] = (byType[it.type]||0) + 1; });
    var typeText = typeList().filter(function(t){ return byType[t.key]; }).map(function(t){ return escapeHtml(t.label) + ' ×' + byType[t.key]; }).join(', ');
    var msg = 'Create <strong>' + total + '</strong> space' + (total===1?'':'s') + ' in <strong>' + plan.perBranch.length + '</strong> branch' + (plan.perBranch.length===1?'':'es') + '?' +
      '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);">' + typeText + '. Codes are generated automatically.</div>' +
      (projected >= 4000 ? '<div style="margin-top:8px;font-size:12.5px;color:var(--warn);"><strong>Heads up:</strong> this brings the database to about ' + projected.toLocaleString() + ' of its ' + DOC_CAP.toLocaleString() + '-document limit.</div>' : '');
    if (!(await askConfirm(msg, false))) return;

    var btn = form.querySelector('#bulkadd-submit');
    if (btn){ btn.disabled = true; btn.textContent = "Creating…"; }
    var created = 0, failed = 0, firstError = null, CHUNK = 10;
    for (var i=0; i<plan.items.length; i+=CHUNK){
      var slice = plan.items.slice(i, i+CHUNK);
      await Promise.all(slice.map(function(it){
        var doc = { branchId: it.branch.id, type: it.type, label: it.label, code: it.code, size: it.size };
        if (localMode){ var lid = uid("sp"); state.spaces[lid] = Object.assign({id: lid}, doc); created++; return Promise.resolve(); }
        return dbApi.collection("spaces").add(doc).then(function(){ created++; }).catch(function(e){ failed++; if (!firstError) firstError = e; });
      }));
      if (btn) btn.textContent = "Creating " + Math.min(i+CHUNK, plan.items.length) + "/" + plan.items.length + "…";
    }
    if (localMode){ saveLocal(); render(); }
    closeModal();
    if (failed){
      var why = (firstError && firstError.code==="quota_exceeded") ? "the database is full (5,000-document limit)" : (firstError && firstError.message ? firstError.message : "unknown error");
      showErrorBanner("Created " + created + " of " + total + " spaces — " + failed + " failed: " + why);
    } else {
      toast("Created " + created + " space" + (created===1?"":"s"));
    }
  }

  // ---------------- expiry digest ----------------
  function computeExpiryDigest(horizonDays){
    var today = todayStr();
    var scoped = restrictedBranchId ? spaceList().filter(function(sp){ return sp.branchId===restrictedBranchId; }) : spaceList();
    var rows = [];
    scoped.forEach(function(sp){
      var st = spaceStatus(sp.id);
      if ((st.status==="active" || st.status==="expiring") && st.daysLeft<=horizonDays){
        rows.push({ sp: sp, st: st, branch: state.branches[sp.branchId] });
      }
    });
    rows.sort(function(a,b){ return a.st.daysLeft - b.st.daysLeft; });
    return rows;
  }

  async function exportExpiryDigest(horizonDays){
    if (!downloadsApi){ toast("Downloads aren't available in this view"); return; }

    try {
      var rows = computeExpiryDigest(horizonDays).map(function(row){

        };

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Expiring in " + horizonDays + "d");

  // ---------------- data integrity check ----------------
  function runDataIntegrityCheck(){
    var issues = [];
    var codeMap = {};
    Object.values(state.spaces).forEach(function(sp){
      if (!state.branches[sp.branchId]) issues.push({ sev: "high", text: "Space \"" + (sp.label||sp.id) + "\" (" + (sp.code||"no code") + ") belongs to a branch that no longer exists." });
      if (sp.code){ (codeMap[sp.code] = codeMap[sp.code] || []).push(sp); }
    });
    Object.keys(codeMap).forEach(function(code){
      if (codeMap[code].length > 1){
        var branches = codeMap[code].map(function(sp){ var b = state.branches[sp.branchId]; return b?branchDisplay(b):"?"; });
        issues.push({ sev: "high", text: "Code \"" + code + "\" is used by " + codeMap[code].length + " spaces (" + branches.join(", ") + ")." });
      }
    });
    Object.values(state.rentals).forEach(function(r){
      var sp = state.spaces[r.spaceId];
      if (!sp){ issues.push({ sev: "high", text: "A rental for \"" + supplierOf(r) + "\" points to a space that no longer exists." }); return; }
      if (!state.branches[r.branchId]) issues.push({ sev: "med", text: "Rental for \"" + supplierOf(r) + "\" (" + sp.label + ") points to a branch that no longer exists." });
      if (r.startDate && r.endDate && r.endDate < r.startDate) issues.push({ sev: "high", text: "Rental for \"" + supplierOf(r) + "\" (" + sp.label + ") ends before it starts (" + fmtDate(r.startDate) + " – " + fmtDate(r.endDate) + ")." });
      if (!(Number(r.price) >= 0)) issues.push({ sev: "med", text: "Rental for \"" + supplierOf(r) + "\" (" + sp.label + ") has an invalid price." });
    });
    var bySpace = {};
    Object.values(state.rentals).forEach(function(r){ (bySpace[r.spaceId] = bySpace[r.spaceId] || []).push(r); });
    Object.keys(bySpace).forEach(function(sid){
      var list = bySpace[sid];
      for (var i=0; i<list.length; i++){
        for (var j=i+1; j<list.length; j++){
          if (list[i].startDate <= list[j].endDate && list[i].endDate >= list[j].startDate){
            var sp = state.spaces[sid];
            issues.push({ sev: "high", text: "Space \"" + (sp?sp.label:sid) + "\" (" + (sp?sp.code:"?") + ") has two rentals with overlapping dates — " + supplierOf(list[i]) + " and " + supplierOf(list[j]) + "." });
          }
        }
      }
    });
    Object.values(state.archive).forEach(function(r){
      if (!state.spaces[r.spaceId]) issues.push({ sev: "low", text: "An archived record for \"" + supplierOf(r) + "\" points to a space that's since been deleted (informational only)." });
    });
    return issues.sort(function(a,b){ var order = {high:0, med:1, low:2}; return order[a.sev]-order[b.sev]; });
  }

  function openDataCheckModal(){
    var issues = runDataIntegrityCheck();
    var body;
    if (!issues.length){
      body = '<div class="empty-note">✅ No issues found — spaces, branches, and rentals are all consistent.</div>';
    } else {
      var sevLabel = { high: "High", med: "Medium", low: "Low" };
      var sevColor = { high: "var(--danger)", med: "var(--warn)", low: "var(--ink-faint)" };
      body = issues.map(function(is){
        return '<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start;">' +
          '<span style="flex-shrink:0;font-size:11px;font-weight:700;color:' + sevColor[is.sev] + ';border:1px solid ' + sevColor[is.sev] + ';border-radius:999px;padding:1px 8px;">' + sevLabel[is.sev] + '</span>' +
          '<span style="font-size:13px;">' + escapeHtml(is.text) + '</span>' +
        '</div>';
      }).join('');
    }
    openModal(
      '<div class="modal-head"><h3>Data check</h3><button class="x-btn" data-action="close-modal">✕</button></div>' +
      '<div class="modal-sub">A read-only scan for things worth a look — duplicate codes, broken links between spaces/branches/rentals, and obviously invalid data. Nothing here is changed automatically.</div>' +
      '<div>' + body + '</div>' +
      '<div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Done</button></div>'
    );
  }

  // ---------------- bulk rental ----------------
  var bulkExcluded = {};
  var bulkPriceOverrides = {};

  function bulkPriceFor(branchId, mainPrice){
    var o = bulkPriceOverrides[branchId];
    return (o !== undefined && o !== "") ? o : mainPrice;
  }

  function hasRentalOverlap(spaceId, start, end){
    return rentalsForSpace(spaceId).some(function(r){ return r.startDate<=end && r.endDate>=start; });
  }

  function computeBulkPlan(p){
    var out = { items: [], skipped: 0, skippedInfo: [], noMatch: [], ready: false, hint: "" };
    if (!p.types.length){ out.hint = "Choose at least one space type to see the matching spaces."; return out; }
    if (!p.start || !p.end || p.end < p.start){ out.hint = "Pick a valid start and end date to check availability."; return out; }
    if (!p.branchIds.length){ out.hint = "Select at least one branch."; return out; }
    out.ready = true;
    var picked = {};
    p.branchIds.forEach(function(id){ picked[id] = true; });
    var kindOrder = typeList().map(function(t){ return t.key; }).filter(function(k){ return p.types.indexOf(k) !== -1; });
    p.types.forEach(function(k){ if (kindOrder.indexOf(k) === -1) kindOrder.push(k); });
    branchList().forEach(function(b){
      if (!picked[b.id]) return;
      var branchCandidates = 0;
      var branchSkipped = [];
      kindOrder.forEach(function(kind){
        var candidates = spaceList().filter(function(s){ return s.branchId===b.id && s.type===kind; })
          .sort(function(a,c){ var byLabel = naturalCompare(a.label, c.label); return byLabel!==0 ? byLabel : naturalCompare(a.code, c.code); });
        branchCandidates += candidates.length;
        var avail = candidates.filter(function(s){ return !hasRentalOverlap(s.id, p.start, p.end); });
        candidates.forEach(function(s){ if (avail.indexOf(s) === -1) branchSkipped.push(s); });
        var chosen = p.qty>0 ? avail.slice(0, p.qty) : avail;
        chosen.forEach(function(s){ out.items.push({ space: s, branch: b }); });
      });
      out.skipped += branchSkipped.length;
      if (branchSkipped.length) out.skippedInfo.push({ branch: b, spaces: branchSkipped });
      if (branchCandidates === 0) out.noMatch.push(b);
    });
    return out;
  }

  function skippedSpaceText(s){
    return typeLabel(s.type) + (s.code ? ' ' + s.code : '');
  }

  function readBulkParams(formEl){
    var fd = new FormData(formEl);
    var qty = parseInt(fd.get('bulkQty'), 10);
    if (isNaN(qty) || qty < 0) qty = 0;
    return {
      types: Array.from(formEl.querySelectorAll('.kind-chip.active')).map(function(el){ return el.getAttribute('data-val'); }),
      branchIds: fd.getAll('bulkBranch'),
      qty: qty,
      start: fd.get('startDate') || "",
      end: fd.get('endDate') || ""
    };
  }

  function updateBulkCounts(wrap){
    var box = wrap.querySelector('#bulk-preview');
    var summary = wrap.querySelector('#bulk-summary');
    var btn = wrap.querySelector('#bulk-submit');
    if (!box) return;
    var total = parseInt(box.getAttribute('data-total')||"0", 10);
    var skipped = parseInt(box.getAttribute('data-skipped')||"0", 10);
    var picked = box.querySelectorAll('input[name="bulkSpace"]:checked').length;
    if (summary){
      summary.textContent = box.getAttribute('data-ready')==="1"
        ? (picked + ' of ' + total + ' available space' + (total===1?'':'s') + ' selected' + (skipped ? ' · ' + skipped + ' skipped (already reserved in that period)' : ''))
        : "";
    }
    if (btn) btn.textContent = picked ? ('Create ' + picked + ' rental' + (picked===1?'':'s')) : 'Create rentals';
    var totalEl = wrap.querySelector('#bulk-total');
    var vatEl = wrap.querySelector('#bulk-vat');
    if (vatEl) vatEl.textContent = "";
    if (totalEl){
      var checked = box.querySelectorAll('input[name="bulkSpace"]:checked');
      if (box.getAttribute('data-ready')!=="1" || checked.length===0){
        totalEl.textContent = "";
      } else {
        var mainRaw = (wrap.querySelector('input[name="price"]')||{}).value || "";
        var sum = 0, incomplete = false, sumNetC = 0, sumVatC = 0;
        checked.forEach(function(cb){
          var raw = bulkPriceFor(cb.getAttribute('data-branch'), mainRaw);
          var num = Number(raw);
          if (raw==="" || !isFinite(num) || num<0) incomplete = true; else { sum += num; var vp = vatParts(num); sumNetC += vp.netC; sumVatC += vp.vatC; }
        });
        totalEl.textContent = incomplete ? "Total: enter a price" : ("Total: " + fmtMoney(sum) + " / month");
        if (vatEl && !incomplete) vatEl.textContent = "+ " + fmtRate(vatRate()) + " VAT " + fmtMoney2(sumVatC/100) + " = " + fmtMoney2((sumNetC+sumVatC)/100) + " incl. VAT";
      }
    }
  }

  function refreshBulkPreview(wrap){
    syncBranchSelectAll(wrap, 'bulkBranch', '#bulk-branch-toggle', '#bulk-branch-count');
    var formEl = wrap.querySelector('form[data-form="bulk-rental"]');
    var box = wrap.querySelector('#bulk-preview');
    if (!formEl || !box) return;
    var plan = computeBulkPlan(readBulkParams(formEl));
    box.setAttribute('data-ready', plan.ready ? "1" : "0");
    box.setAttribute('data-total', String(plan.items.length));
    box.setAttribute('data-skipped', String(plan.skipped));
    if (!plan.ready){
      box.innerHTML = '<div style="color:var(--ink-faint);padding:6px 0;">' + escapeHtml(plan.hint) + '</div>';
    } else if (plan.items.length===0){
      box.innerHTML = '<div style="color:var(--ink-faint);padding:6px 0;">No available spaces match — ' + (plan.skipped ? 'they are all already reserved in that period.' : 'no spaces of that type in the selected branches.') + '</div>';
    } else {
      var html = '';
      var lastBranch = null;
      var mainPrice = (formEl.querySelector('input[name="price"]')||{}).value || "";
      plan.items.forEach(function(it){
        if (it.branch.id !== lastBranch){
          lastBranch = it.branch.id;
          var over = bulkPriceOverrides[it.branch.id] !== undefined;
          var shown = over ? bulkPriceOverrides[it.branch.id] : mainPrice;
          html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 2px;">' +
            '<span style="font-weight:700;font-size:11.5px;color:var(--ink-soft);">' + escapeHtml(branchDisplay(it.branch)) + '</span>' +

  async function submitBulkRental(form, data){
    if (!isAdminSession) return;
    var supplier = (data.supplier||"").trim();
    if (!supplier){ toast("Enter a supplier"); return; }
    if (!data.startDate || !data.endDate || data.endDate < data.startDate){ toast("End date must be on or after the start date"); return; }
    var selectedIds = new FormData(form).getAll('bulkSpace');
    if (!selectedIds.length){ toast("No spaces selected"); return; }

    // Re-check availability right now — someone else may have rented a space since the preview was drawn.
    var valid = selectedIds.filter(function(id){ return state.spaces[id] && !hasRentalOverlap(id, data.startDate, data.endDate); });
    var dropped = selectedIds.length - valid.length;
    if (!valid.length){ toast("Those spaces were just reserved by someone else — nothing to create"); return; }

    var plan = computeBulkPlan(readBulkParams(form));
    function nameList(names, max){
      var shown = names.slice(0, max).map(escapeHtml).join(', ');
      return shown + (names.length > max ? ' and ' + (names.length - max) + ' more' : '');
    }
    var skippedNames = plan.skippedInfo.map(function(e){ return branchDisplay(e.branch); });
    var takenBranches = [];
    selectedIds.forEach(function(id){
      if (valid.indexOf(id) !== -1 || !state.spaces[id]) return;
      var bn = branchDisplay(state.branches[state.spaces[id].branchId]);
      if (takenBranches.indexOf(bn) === -1) takenBranches.push(bn);
    });
    var mainPrice = data.price;
    var branchPrices = {};
    var badBranch = null;
    valid.forEach(function(id){
      var bid = state.spaces[id].branchId;
      if (branchPrices[bid] !== undefined) return;
      var raw = bulkPriceFor(bid, mainPrice);
      var num = Number(raw);
      if (raw === "" || !isFinite(num) || num < 0){ if (!badBranch) badBranch = bid; }
      branchPrices[bid] = raw;
    });
    if (badBranch){ toast('Check the price for ' + branchDisplay(state.branches[badBranch])); return; }
    var totalPerMonth = 0, totalVatC = 0, totalNetC = 0;
    valid.forEach(function(id){ var pr = Number(branchPrices[state.spaces[id].branchId]); totalPerMonth += pr; var vp = vatParts(pr); totalNetC += vp.netC; totalVatC += vp.vatC; });
    var customLines = Object.keys(branchPrices).filter(function(bid){ return Number(branchPrices[bid]) !== Number(mainPrice); })
      .map(function(bid){ return branchDisplay(state.branches[bid]) + ' $' + Number(branchPrices[bid]).toLocaleString(); });
    var msg = 'Create <strong>' + valid.length + '</strong> rental' + (valid.length===1?'':'s') + ' for <strong>' + escapeHtml(supplier) + '</strong> from ' + escapeHtml(fmtDate(data.startDate)) + ' to ' + escapeHtml(fmtDate(data.endDate)) + ' at <strong>$' + Number(mainPrice).toLocaleString() + '</strong>/month' + (customLines.length ? ' by default' : '') + '?' +
      '<div style="margin-top:8px;font-size:13px;"><strong>Total: ' + escapeHtml(fmtMoney(totalPerMonth)) + ' per month</strong> across ' + valid.length + ' space' + (valid.length===1?'':'s') + ' <span style="color:var(--ink-soft);">(excl. VAT)</span>.' +
        '<div style="margin-top:2px;font-size:12.5px;color:var(--ink-soft);">+ ' + escapeHtml(fmtRate(vatRate())) + ' VAT ' + escapeHtml(fmtMoney2(totalVatC/100)) + ' = <strong>' + escapeHtml(fmtMoney2((totalNetC+totalVatC)/100)) + ' incl. VAT</strong> per month.</div></div>' +
      (customLines.length ? '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);"><strong>Different price in:</strong> ' + nameList(customLines, 8) + '</div>' : '') +
      (skippedNames.length ? '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);"><strong>Not included — already reserved in that period:</strong> ' + nameList(skippedNames, 8) + '</div>' : '') +
      (dropped ? '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft);">' + dropped + ' selected space' + (dropped===1?' was':'s were') + ' just reserved by someone else and will be skipped (' + nameList(takenBranches, 8) + ').</div>' : '');
    if (!(await askConfirm(msg, false))) return;

    var btn = form.querySelector('#bulk-submit');
    if (btn){ btn.disabled = true; btn.textContent = "Creating…"; }

    var bulkId = uid("bulk");
    var createdAt = new Date().toISOString();
    var myName = myDisplayName();
    var executed = data.executed==="yes";
    var created = 0, failed = 0, firstError = null;
    var CHUNK = 10;

    for (var i=0; i<valid.length; i+=CHUNK){
      var slice = valid.slice(i, i+CHUNK);
      await Promise.all(slice.map(function(spaceId){
        var sp = state.spaces[spaceId];
        var body = sanitizeRentalBody({
          spaceId: spaceId, branchId: sp.branchId, supplier: supplier, brands: data.brands, categories: data.categories,
          startDate: data.startDate, endDate: data.endDate, price: branchPrices[sp.branchId], notes: data.notes,
          executed: executed, removed: false, rentalType: data.rentalType, createdAt: createdAt, bulkId: bulkId,
          lastEditedBy: myName, lastEditedAt: createdAt
        });
        if (localMode){ var lid = uid("rt"); state.rentals[lid] = Object.assign({id: lid}, body); created++; return Promise.resolve(); }
        return dbApi.collection("rentals").add(body).then(function(){ created++; }).catch(function(e){ failed++; if (!firstError) firstError = e; });
      }));
      if (btn) btn.textContent = "Creating " + Math.min(i+CHUNK, valid.length) + "/" + valid.length + "…";
    }

    if (localMode){ saveLocal(); render(); }
    closeModal();
    if (failed){
      var why = (firstError && firstError.code==="quota_exceeded") ? "the database is full (5,000-document limit)" : (firstError && firstError.message ? firstError.message : "unknown error");
      showErrorBanner("Created " + created + " of " + valid.length + " rentals — " + failed + " failed: " + why);
    } else {
      toast("Created " + created + " rental" + (created===1?"":"s") + (dropped ? " (" + dropped + " skipped)" : ""));
    }
  }

  var driveFileIdCache = null;

  async function syncFromDrive(silent){
    if (!mcpApi){ if(!silent) toast("Google Drive isn't connected here"); return; }
    if (typeof XLSX==="undefined"){ if(!silent) toast("Couldn't load the Excel library — try again"); return; }
    try {
      if (!silent) toast("Syncing from Google Drive…");
      var drive = await mcpApi.server("Google Drive");
      var fileId = driveFileIdCache;
      if (!fileId){
        var found = await drive.search_files({ query: "title contains 'marketing'" });
        var files = (found && found.files) || [];
        var match = files.find(function(f){ return /marketing/i.test(f.title) && /xlsx?$/i.test(f.title); }) || files[0];
        if (!match){ if(!silent) toast("Couldn't find the marketing file in Google Drive"); return; }
        fileId = match.id;
        driveFileIdCache = fileId;
      }
      var dl = await drive.download_file_content({ fileId: fileId });
      var payload = dl;
      if (payload && payload.content===undefined && typeof payload.text==="string"){
        try { payload = JSON.parse(payload.text); } catch(e2) {}
      }
      var b64 = payload && payload.content;
      if (!b64){ if(!silent) toast("Couldn't read that file's contents"); return; }
      var wb = XLSX.read(b64, { type: "base64" });

      var sheetRows = function(name){ return wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "" }) : []; };

      var supRows = sheetRows("supplier").slice(1).filter(function(r){ return r[0] || r[1]; });
      var supItems = supRows
        .map(function(r){ return { code: String(r[0]||"").trim(), name: String(r[1]||"").trim() }; })
        .filter(function(s){ return s.code && s.name && !/closed account/i.test(s.name); });
      if (supItems.length) await dbApi.doc("refdata/suppliers").set({ items: supItems });

      var catRows = sheetRows("category").slice(1).filter(function(r){ return r[0] || r[1]; });
      var catItems = catRows.map(function(r){ return { code: String(r[0]||"").trim(), description: String(r[1]||"").trim() }; }).filter(function(c){ return c.code; });
      if (catItems.length) await dbApi.doc("refdata/categories").set({ items: catItems });

      var brandRows = sheetRows("brands").slice(1).map(function(r){ return String(r[0]||"").trim(); }).filter(Boolean);
      if (brandRows.length) await dbApi.doc("refdata/brands").set({ items: brandRows });

      var locRows = sheetRows("location").slice(1).filter(function(r){ return r[0] || r[1]; });
      var byCode = {};
      Object.values(state.branches).forEach(function(b){ if (b.code) byCode[b.code.toUpperCase()] = b; });
      for (var i=0;i<locRows.length;i++){
        var code = String(locRows[i][0]||"").trim().toUpperCase();
        var name = String(locRows[i][1]||"").trim();
        var existingBranch = byCode[code];
        if (existingBranch && name && existingBranch.name!==name){
          await dbApi.doc("branches/"+existingBranch.id).update({ name: name });
        }
      }

      if (!silent) toast("Synced from Google Drive");
    } catch(e){
      if (silent) return;
      if (e && e.code==="needs_reauth") toast("Reconnect Google Drive in Settings → Connectors");
      else if (e && e.code==="server_not_connected") toast("Google Drive isn't connected here");
      else toast("Sync failed — try again");
    }
  }

  async function backupToExcel(){

    try {
      toast("Building backup…");
      var wb = XLSX.utils.book_new();

      var branchRows = branchList().map(function(b){ return { id: b.id, code: b.code||"", name: b.name, order: b.order||"" }; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(branchRows), "Branches");

      var typeRows = typeList().map(function(t){ return { code: t.key, name: t.label, expiringDays: t.expiringDays||30 }; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(typeRows), "Types");

      var spaceRows = spaceList().map(function(sp){
        var b = state.branches[sp.branchId];
        return { id: sp.id, branchId: sp.branchId, branch: b?branchDisplay(b):"", typeKey: sp.type, type: typeLabel(sp.type), label: sp.label, code: sp.code||"", size: sp.size||"", remarks: sp.remarks||"" };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(spaceRows), "Spaces");

      var rentalRows = Object.values(state.rentals).map(function(r){
        var sp = state.spaces[r.spaceId]; var b = state.branches[r.branchId];
        return { id: r.id, branchId: r.branchId, branch: b?branchDisplay(b):"", spaceId: r.spaceId, space: sp?sp.label:"", spaceCode: sp?sp.code||"":"", supplier: supplierOf(r), brands: brandOf(r), categories: categoriesOf(r).join(", "), startDate: r.startDate, endDate: r.endDate, price: r.price, vatRate: vatRate(), vat: vatParts(r.price).vat, priceInclVat: vatParts(r.price).gross, executed: r.executed?"Yes":"No", removed: r.removed?"Yes":"No", notes: r.notes||"" };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rentalRows), "Rentals");

      var archiveRows = Object.values(state.archive).map(function(r){
        var sp = state.spaces[r.spaceId]; var b = state.branches[r.branchId];
        return { id: r.id, branchId: r.branchId, branch: b?branchDisplay(b):"", spaceId: r.spaceId, space: sp?sp.label:"", spaceCode: sp?sp.code||"":"", supplier: supplierOf(r), brands: brandOf(r), categories: categoriesOf(r).join(", "), startDate: r.startDate, endDate: r.endDate, price: r.price, vatRate: vatRate(), vat: vatParts(r.price).vat, priceInclVat: vatParts(r.price).gross, archivedAt: r.archivedAt||"", notes: r.notes||"" };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(archiveRows), "Archived transactions");

      var supplierRows = state.supplierRefs.map(function(s){ return { code: s.code, name: s.name }; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(supplierRows), "Suppliers");

      var categoryRows = state.categoryRefs.map(function(c){ return { code: c.code, description: c.description }; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(categoryRows), "Categories");

      var privRows = Object.values(state.privileges).map(function(p){ return { userId: p.id, role: p.role||"" }; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(privRows), "Privileges");

      var wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      var blob = new Blob([wbout], { type: "application/octet-stream" });
      var filename = "le-charcutier-backup-" + todayStr() + ".xlsx";
      var result = await downloadsApi.save({ filename: filename, data: blob });
      if (result.status!=="declined"){
        var nowIso = new Date().toISOString();
        state.lastBackupAt = nowIso;
        if (localMode){ saveLocal(); } else { try { await dbApi.doc("meta/lastBackup").set({ at: nowIso }); } catch(e2) {} }
      }
      toast(result.status==="saved" ? "Backup saved" : "Backup delivered");
    } catch(e){
      if (e && e.code==="declined"){ /* user cancelled, no toast needed */ }
      else { toast("Couldn't create backup"); }
    }
  }

  var pendingRestore = null;

  function triggerRestorePicker(){
    if (typeof XLSX==="undefined"){ toast("Couldn't load the Excel library — try again"); return; }
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx";
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", function(){
      var file = input.files && input.files[0];
      document.body.removeChild(input);
      if (file) parseRestoreFile(file);
    });
    input.click();
  }

  function parseRestoreFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        var sheet = function(name){ return wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: "" }) : []; };
        pendingRestore = {
          branches: sheet("Branches"),
          types: sheet("Types"),
          spaces: sheet("Spaces"),
          rentals: sheet("Rentals"),
          archive: sheet("Archived transactions"),
          suppliers: sheet("Suppliers"),
          categories: sheet("Categories"),
          privileges: sheet("Privileges")
        };
        var total = Object.keys(pendingRestore).reduce(function(sum,k){ return sum + pendingRestore[k].length; }, 0);
        if (total===0){ toast("No recognizable data found in that file"); pendingRestore = null; return; }
        openRestoreConfirmModal();
      } catch(e2){ toast("Couldn't read that file — is it a backup from this app?"); pendingRestore = null; }
    };
    reader.readAsArrayBuffer(file);
  }
