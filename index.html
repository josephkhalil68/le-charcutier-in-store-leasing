  async function applyRestore(){
    if (!pendingRestore || !dbApi) return;
    var d = pendingRestore;
    pendingRestore = null;
    closeModal();
    toast("Restoring…");
    try {
      for (var i=0;i<d.branches.length;i++){
        var b = d.branches[i];
        if (!b.id) continue;
        await dbApi.doc("branches/"+b.id).set({ code: String(b.code||""), name: String(b.name||""), order: Number(b.order)||0 });
      }
      for (var j=0;j<d.types.length;j++){
        var t = d.types[j];
        if (!t.code) continue;
        await dbApi.doc("types/"+t.code).set({ key: String(t.code), label: String(t.name||t.code), expiringDays: Number(t.expiringDays)||30 });
      }
      for (var k=0;k<d.spaces.length;k++){
        var sp = d.spaces[k];
        if (!sp.id || !sp.branchId) continue;
        await dbApi.doc("spaces/"+sp.id).set({ branchId: String(sp.branchId), type: String(sp.typeKey||sp.type||""), label: String(sp.label||""), code: String(sp.code||""), size: String(sp.size||""), remarks: String(sp.remarks||"") });
      }
      for (var m=0;m<d.rentals.length;m++){
        var r = d.rentals[m];
        if (!r.id || !r.spaceId) continue;
        await dbApi.doc("rentals/"+r.id).set({ spaceId: String(r.spaceId), branchId: String(r.branchId||""), supplier: String(r.supplier||""), brands: String(r.brands||r.brand||"").split(",").map(function(s){return s.trim();}).filter(Boolean), categories: String(r.categories||"").split(",").map(function(s){return s.trim();}).filter(Boolean), startDate: String(r.startDate||""), endDate: String(r.endDate||""), price: Number(r.price)||0, executed: r.executed==="Yes", removed: r.removed==="Yes", notes: String(r.notes||"") });
      }
      for (var n=0;n<d.archive.length;n++){
        var a = d.archive[n];
        if (!a.id || !a.spaceId) continue;
        await dbApi.doc("archive/"+a.id).set({ spaceId: String(a.spaceId), branchId: String(a.branchId||""), supplier: String(a.supplier||""), brands: String(a.brands||a.brand||"").split(",").map(function(s){return s.trim();}).filter(Boolean), categories: String(a.categories||"").split(",").map(function(s){return s.trim();}).filter(Boolean), startDate: String(a.startDate||""), endDate: String(a.endDate||""), price: Number(a.price)||0, archivedAt: String(a.archivedAt||""), notes: String(a.notes||"") });
      }
      if (d.suppliers.length){
        var supItems = d.suppliers.filter(function(s){return s.code;}).map(function(s){ return { code: String(s.code), name: String(s.name||"") }; });
        await dbApi.doc("refdata/suppliers").set({ items: supItems });
      }
      if (d.categories.length){
        var catItems = d.categories.filter(function(c){return c.code;}).map(function(c){ return { code: String(c.code), description: String(c.description||"") }; });
        await dbApi.doc("refdata/categories").set({ items: catItems });
      }
      for (var p=0;p<d.privileges.length;p++){
        var pr = d.privileges[p];
        if (!pr.userId) continue;
        await dbApi.doc("privileges/"+pr.userId).set({ role: String(pr.role||"viewer") });
      }
      toast("Restore complete");
    } catch(e){ toast("Restore stopped partway — check the data before retrying"); }
  }

  function renderTableOnly(){
    var wrap = root.querySelector('.table-wrap');
    if (!wrap) return;
    var rows = filteredSpaces();
    var body = wrap.querySelector('tbody');
    if (!body) return;
    if (rows.length===0){
      body.innerHTML = '<tr><td colspan="10"><div class="empty-note">No spaces match these filters.</div></td></tr>';
      return;
    }
    var html = '';
    var prevBranch = null;
    var branchGroupIndex = -1;
    rows.forEach(function(sp){
      var b = state.branches[sp.branchId];
      var st = spaceStatus(sp.id);
      var r = st.rental;
      var isNewBranch = prevBranch!==null && sp.branchId!==prevBranch;
      if (prevBranch===null || isNewBranch) branchGroupIndex++;
      prevBranch = sp.branchId;
      var rowClasses = [isNewBranch?'branch-start':'', (branchGroupIndex%2===1)?'branch-alt':'', st.status==="expired"?'row-expired':''].filter(Boolean).join(' ');
      html += '<tr class="' + rowClasses + '">' +
        '<td><div class="cell-space"><span class="code">' + escapeHtml(sp.label) + '</span><span class="branch">' + escapeHtml(b?branchDisplay(b):"—") + '</span></div></td>' +
        '<td>' + (sp.code ? '<span class="code-badge">' + escapeHtml(sp.code) + '</span>' : '<span style="color:var(--ink-faint)">—</span>') + '</td>' +
        '<td>' + (sp.size ? escapeHtml(sp.size) : '<span style="color:var(--ink-faint)">—</span>') + '</td>' +
        '<td><span class="type-pill">' + escapeHtml(typeLabel(sp.type)) + '</span></td>' +
        '<td><span class="status-pill ' + st.status + '">' + statusLabel(st.status) + '</span>' + contractBadge(st) + (st.status==="expired"?'<span class="remove-notice">⚠ Remove this</span>':'') + '</td>' +
        '<td>' + execCell(st) + '</td>' +
        '<td>' + (r ? '<span class="client-name">' + escapeHtml(supplierOf(r)) + '</span>' + (brandOf(r)?'<div class="period">'+escapeHtml(brandOf(r))+'</div>':'') + (categoriesOf(r).length?'<div class="cat-pills">'+categoriesOf(r).map(function(c){return '<span class="cat-pill">'+escapeHtml(c)+'</span>';}).join('')+'</div>':'') : '<span style="color:var(--ink-faint)">—</span>') + '</td>' +
        '<td>' + (r ? '<span class="period">' + fmtDate(r.startDate) + ' – ' + fmtDate(r.endDate) + '</span>' : '—') + '</td>' +
        '<td>' + (r ? '<span class="price">' + fmtMoney(r.price) + '</span>' + vatSubHtml(r.price) : '—') + '</td>' +
        '<td><div class="row-actions">' + rowActions(sp, st) + '</div></td>' +
      '</tr>';
    });
    body.innerHTML = html;
    body.querySelectorAll('[data-action]').forEach(function(el){ el.addEventListener('click', handleAction); });

      };
      rentalPriceInput.addEventListener('input', refreshRentalVat);
      refreshRentalVat();
    }
    if (wrap.querySelector('form[data-form="bulk-add-space"]')){
      var baHandler = function(e){
        var t = e.target;
        if (!t) return;
        // typed fields already report their final value through 'input'; skip the extra blur-time 'change'
        if (e.type==='change' && t.tagName==='INPUT' && (t.type==='number' || t.type==='text')) return;
        var isRowField = t.classList && t.classList.contains('bulk-add-qty');
        if (isRowField || t.name==='baBranch'){ refreshBulkAddPreview(wrap); }
      };
      wrap.addEventListener('input', baHandler);
      wrap.addEventListener('change', baHandler);
      wrap.addEventListener('keydown', function(e){
        if (e.key==='Enter' && e.target && e.target.classList && (e.target.classList.contains('bulk-add-qty') || e.target.classList.contains('bulk-add-size'))){ e.preventDefault(); e.target.blur(); }
      });
    }
    if (wrap.querySelector('form[data-form="bulk-rental"]')){
      var bulkHandler = function(e){
        var t = e.target;
        if (t && t.classList && t.classList.contains('bulk-branch-price')){
          var bid = t.getAttribute('data-branch');
          var mainVal = (wrap.querySelector('input[name="price"]')||{}).value || "";
          if (e.type==='change' && t.value.trim()===""){ delete bulkPriceOverrides[bid]; t.value = mainVal; }
          else if (e.type==='input' && t.value.trim()!==""){ bulkPriceOverrides[bid] = t.value.trim(); }
          var isOver = bulkPriceOverrides[bid] !== undefined;
          t.style.borderColor = isOver ? 'var(--primary)' : 'var(--border)';
          var resetBtn = t.parentElement.querySelector('[data-action="bulk-price-reset"]');
          if (resetBtn) resetBtn.style.display = isOver ? '' : 'none';
          updateBulkCounts(wrap);
          return;
        }
        if (!t || !t.name) return;
        // 'input' already delivered the final value while typing; the extra blur-time 'change' event would
        // redraw the preview underneath whatever the user just clicked into, so ignore it for typed fields.
        if (e.type==='change' && t.tagName==='INPUT' && (t.type==='number' || t.type==='text')) return;
        if (t.name==='bulkSpace'){ bulkExcluded[t.value] = !t.checked; updateBulkCounts(wrap); return; }
        if (t.name==='bulkBranch' || t.name==='bulkQty' || t.name==='price' || t.name==='startDate' || t.name==='endDate' || t.name==='rentalType'){ refreshBulkPreview(wrap); }
      };
      wrap.addEventListener('input', bulkHandler);
      wrap.addEventListener('change', bulkHandler);
      wrap.addEventListener('click', function(e){
        var rb = e.target.closest && e.target.closest('[data-action="bulk-price-reset"]');
        if (!rb) return;
        var bid = rb.getAttribute('data-branch');
        delete bulkPriceOverrides[bid];
        var inp = rb.parentElement.querySelector('.bulk-branch-price');
        if (inp){ inp.value = (wrap.querySelector('input[name="price"]')||{}).value || ""; inp.style.borderColor = 'var(--border)'; }
        rb.style.display = 'none';
        updateBulkCounts(wrap);
      });
      wrap.addEventListener('keydown', function(e){
        if (e.key==='Enter' && e.target && e.target.classList && e.target.classList.contains('bulk-branch-price')){ e.preventDefault(); e.target.blur(); }
      });
    }
    var photoInput = wrap.querySelector('input[data-action="space-photo-file"]');

        var spaceId = photoInput.getAttribute('data-space');
        if (file) uploadSpacePhoto(spaceId, file);
      });
    }
    var addBranchSel = wrap.querySelector('#add-space-branch');
    var addLabelInput = wrap.querySelector('#add-space-label');
    var codePreview = wrap.querySelector('#space-code-preview');
    if (codePreview && addBranchSel && addLabelInput){
      var updatePreview = function(){
        codePreview.textContent = addBranchSel.value ? generateSpaceCode(addBranchSel.value, addLabelInput.value) : '—';
      };
      addBranchSel.addEventListener('change', updatePreview);
      addLabelInput.addEventListener('input', updatePreview);
      updatePreview();
    }
    var rentalTypeSelect = wrap.querySelector('#rental-type-select');
    var startDateInput = wrap.querySelector('#rental-start-date');
    var endDateInput = wrap.querySelector('#rental-end-date');
    if (rentalTypeSelect && startDateInput && endDateInput){
      rentalTypeSelect.addEventListener('change', function(){
        if (rentalTypeSelect.value==="contractual"){
          var year = new Date().getFullYear();
          startDateInput.value = year + "-01-01";
          endDateInput.value = year + "-12-31";
          startDateInput.setAttribute("readonly", "readonly");
          endDateInput.setAttribute("readonly", "readonly");
        } else {
          startDateInput.removeAttribute("readonly");
          endDateInput.removeAttribute("readonly");
        }
      });
    }
  }

  async function handleFormSubmit(e){
    e.preventDefault();
    var form = e.currentTarget;
    var kind = form.getAttribute('data-form');
    var data = {};
    new FormData(form).forEach(function(v,k){ data[k]=v; });
    data.categories = new FormData(form).getAll('categories').map(function(s){ return s.trim(); }).filter(Boolean);
    data.brands = new FormData(form).getAll('brands').map(function(s){ return s.trim(); }).filter(Boolean);
    if (kind==="add-space"){
      var genCode = generateSpaceCode(data.branchId, data.label.trim());
      await addSpace(data.branchId, data.type, data.label.trim(), genCode, (data.size||"").trim());
      closeModal(); toast("Space added — code " + genCode);
    } else if (kind==="edit-space"){
      var editedSpaceId = form.getAttribute('data-space');
      var newCode = (data.code||"").trim();
      if (isCodeTaken(newCode, editedSpaceId)){ toast("That code is already used by another space"); return; }
      await editSpace(editedSpaceId, data.type, data.label.trim(), newCode, (data.remarks||"").trim(), (data.size||"").trim());
      closeModal(); toast("Space updated");
    } else if (kind==="rental"){
      if (!(data.supplier||"").trim()){ toast("Enter a supplier"); return; }
      if (data.price==="" || !isFinite(Number(data.price)) || Number(data.price) < 0){ toast("Enter a valid price"); return; }
      if (!data.startDate || !data.endDate){ toast("Enter both a start and end date"); return; }
      if (data.endDate < data.startDate){ toast("End date must be after start date"); return; }
      data.executed = data.executed==="yes";
      data.removed = data.removed==="yes";
      var spaceId = form.getAttribute('data-space');
      var rentalId = form.getAttribute('data-rental');
      var branchId = state.spaces[spaceId] ? state.spaces[spaceId].branchId : null;
      if (data.removed){
        var archiveId = rentalId || uid("rt");
        var archiveBody = { spaceId: spaceId, branchId: branchId, supplier: data.supplier, brands: data.brands||[], categories: data.categories||[], startDate: data.startDate, endDate: data.endDate, price: Number(data.price)||0, notes: data.notes||"", executed: data.executed, removed: true, rentalType: data.rentalType==="contractual"?"contractual":"normal" };
        await archiveRental(archiveId, archiveBody);
        toast("Rental archived");
      } else if (rentalId){ await editRental(rentalId, data); toast("Rental updated"); }
      else {
        var wantsPrint = await askConfirm("Do you want to print this rental?", false, "Yes", "No");
        await addRental(spaceId, branchId, data);
        toast("Rental saved");
        if (wantsPrint) await generateRentalPdf(form);
      }
      closeModal();
    } else if (kind==="vat-settings"){
      if (!isAdminSession) return;
      var newRate = Number(data.vatRate);
      if (data.vatRate === "" || !isFinite(newRate) || newRate < 0 || newRate > 100){ toast("Enter a VAT rate between 0 and 100"); return; }
      newRate = Math.round(newRate * 100) / 100;
      if (await setVatRate(newRate)){ closeModal(); toast("VAT rate set to " + fmtRate(newRate)); }
    } else if (kind==="bulk-add-space"){
      await submitBulkAddSpaces(form);
    } else if (kind==="bulk-rental"){
      await submitBulkRental(form, data);
    } else if (kind==="add-branch"){
      if (data.name && data.name.trim()){ await addBranch(data.name.trim(), (data.code||"").trim().toUpperCase()); form.reset(); openBranchesModal(); }
    } else if (kind==="add-type"){
      var newKey = (data.key||"").trim().toUpperCase().replace(/\s+/g,"");
      var newLabel = (data.label||"").trim();
      if (!newKey || !newLabel){ toast("Enter both a code and a name"); return; }
      if (state.types[newKey]){ toast("That code is already used by another type"); return; }
      await addType(newKey, newLabel, data.expiringDays);
      form.reset(); openTypesModal();
    }
  }

  async function handleAction(e){
    var el = e.currentTarget;
    var action = el.getAttribute('data-action');
    if (action==="tab"){ state.tab = el.getAttribute('data-tab'); render(); return; }
    if (action==="filter-branch"){ if(!restrictedBranchId){ state.filters.branch = el.getAttribute('data-id'); state.tab="spaces"; render(); } return; }
    if (action==="set-type"){ state.filters.type = el.getAttribute('data-val'); render(); return; }
    if (action==="set-status"){ state.filters.status = el.getAttribute('data-val'); render(); return; }
    if (action==="open-add-space"){ if(isGlobalAdmin) openAddSpaceModal(); return; }
    if (action==="open-bulk-rental"){ if(isGlobalAdmin) openBulkRentalModal(); return; }
    if (action==="open-vat"){ if(isGlobalAdmin) openVatModal(); return; }
    if (action==="open-data-check"){ if(isGlobalAdmin) openDataCheckModal(); return; }
    if (action==="open-batches"){ if(isGlobalAdmin) openBatchesModal(); return; }
    if (action==="open-expiry-digest"){ openExpiryDigestModal(30); return; }
    if (action==="expiry-horizon"){ openExpiryDigestModal(Number(el.getAttribute('data-days'))); return; }
    if (action==="export-expiry-digest"){ if(isGlobalAdmin) await exportExpiryDigest(Number(el.getAttribute('data-days'))); return; }
    if (action==="open-photo-gallery"){ openPhotoGalleryModal(); return; }
    if (action==="view-photo"){ window.open(blobUrl(el.getAttribute('data-asset')), "_blank"); return; }
    if (action==="undo-batch"){ if(isGlobalAdmin) await undoBatch(el.getAttribute('data-bulk')); return; }
    if (action==="exit-app"){ closeModal(); state.exited = true; render(); return; }
    if (action==="cancel-exit"){ state.exited = false; render(); return; }
    if (action==="open-bulk-add-space"){ if(isGlobalAdmin) openBulkAddSpaceModal(); return; }
    if (action==="bulkadd-branches-toggle" || action==="bulk-branches-toggle"){
      var togOverlay = el.closest('.overlay');
      if (togOverlay){
        var isAdd = action==="bulkadd-branches-toggle";
        var togBoxes = Array.from(togOverlay.querySelectorAll('input[name="' + (isAdd ? 'baBranch' : 'bulkBranch') + '"]'));
        var allOn = togBoxes.length > 0 && togBoxes.every(function(cb){ return cb.checked; });
        togBoxes.forEach(function(cb){ cb.checked = !allOn; });
        if (isAdd) refreshBulkAddPreview(togOverlay); else refreshBulkPreview(togOverlay);
      }
      return;
    }
    if (action==="bulk-toggle-type" || action==="bulk-types-all" || action==="bulk-types-none"){
      var kindOverlay = el.closest('.overlay');
      if (kindOverlay){
        var kindBtns = kindOverlay.querySelectorAll('.kind-chip');
        if (action==="bulk-toggle-type"){
          el.classList.toggle('active');
          el.setAttribute('aria-pressed', el.classList.contains('active') ? 'true' : 'false');
        } else {
          kindBtns.forEach(function(k){ k.classList.toggle('active', action==="bulk-types-all"); k.setAttribute('aria-pressed', action==="bulk-types-all" ? 'true' : 'false'); });
        }
        refreshBulkPreview(kindOverlay);
      }
      return;
    }
    if (action==="open-edit-space"){ if(isAdminSession) openEditSpaceModal(el.getAttribute('data-space')); return; }
    if (action==="open-rental"){
      var existingRentalId = el.getAttribute('data-rental')||null;
      if (!existingRentalId && !isAdminSession) return;
      openRentalModal(el.getAttribute('data-space'), existingRentalId);
      return;
    }
    if (action==="open-branches"){ if(isGlobalAdmin) openBranchesModal(); return; }
    if (action==="open-branch-access"){ if(isGlobalAdmin) openBranchAccessModal(); return; }

    if (action==="open-types"){ if(isGlobalAdmin) openTypesModal(); return; }
    if (action==="open-privileges"){ if(isGlobalAdmin) openPrivilegesModal(); return; }
    if (action==="backup-excel"){ if(isGlobalAdmin) backupToExcel(); return; }
    if (action==="sync-drive"){ if(isGlobalAdmin) syncFromDrive(false); return; }
    if (action==="restore-backup"){ if(isGlobalAdmin) triggerRestorePicker(); return; }
    if (action==="confirm-restore"){ if(isGlobalAdmin) applyRestore(); return; }
    if (action==="save-self-name"){
      var nameInput = document.getElementById('self-name-input');
      var val = nameInput ? nameInput.value.trim() : "";
      if (!val){ toast("Type a name first, or click Skip"); return; }
      await setMySelfName(val);
      closeModal();
      return;
    }
    if (action==="skip-self-name"){ await skipMySelfName(); closeModal(); return; }
    if (action==="close-modal"){ closeModal(); return; }
    if (action==="overlay-close"){ if (e.target===el) closeModal(); return; }
    if (action==="delete-space"){
      if (await askConfirm("Delete this space and its rental history?")){ await deleteSpace(el.getAttribute('data-space')); closeModal(); toast("Space deleted"); }
      return;
    }
    if (action==="remove-space-photo"){
      if (await askConfirm("Remove this photo?")){ await removeSpacePhoto(el.getAttribute('data-space'), el.getAttribute('data-asset')); }
      return;
    }
    if (action==="delete-rental"){
      if (!isGlobalAdmin) return;
      if (await askConfirm("Delete this rental record?")){ await deleteRental(el.getAttribute('data-rental')); closeModal(); toast("Rental deleted"); }
      return;
    }
    if (action==="print-rental-tag"){
      var rentalForm = el.closest('form[data-form="rental"]');
      if (rentalForm) await printRentalTag(rentalForm);
      return;
    }
    if (action==="print-pdf-rental"){
      var pdfForm = el.closest('form[data-form="rental"]');
      if (pdfForm) await generateRentalPdf(pdfForm);
      return;
    }
    if (action==="rename-branch"){ /* handled on blur below */ return; }
    if (action==="delete-branch"){
      var b = state.branches[el.getAttribute('data-id')];
      if (b && await askConfirm('Remove "' + escapeHtml(branchDisplay(b)) + '" and all its spaces and rentals?')){ await deleteBranch(el.getAttribute('data-id')); openBranchesModal(); toast("Branch removed"); }
      return;
    }
    if (action==="delete-type"){
      var tkey = el.getAttribute('data-id');
      if (await askConfirm('Remove type "' + escapeHtml(typeLabel(tkey)) + '"?')){ await deleteType(tkey); openTypesModal(); toast("Type removed"); }
      return;
    }
    if (action==="rename-type"){ return; }
    if (action==="add-category-chip"){ addCategoryChip(); return; }
    if (action==="add-brand-chip"){ addBrandChip(); return; }
    if (action==="generate-space-code"){
      var editSpaceId = el.getAttribute('data-space');
      var sp2 = state.spaces[editSpaceId];
      var labelInput = document.getElementById('edit-space-label');
      var codeInput = document.getElementById('edit-space-code');
      if (sp2 && labelInput && codeInput){
        codeInput.value = generateSpaceCode(sp2.branchId, labelInput.value, editSpaceId);
      }
      return;
    }
    if (action==="remove-category-chip"){ el.closest('.cat-chip').remove(); return; }
    if (action==="remove-brand-chip"){ el.closest('.cat-chip').remove(); return; }
  }

  function renderBrandSuggestions(wrap, query){
    var box = wrap.querySelector('#brand-suggestions');
    if (!box) return;
    var q = (query||"").trim().toLowerCase();
    if (!q){ box.style.display = "none"; box.innerHTML = ""; return; }
    var starts = [], contains = [];
    state.brandRefs.forEach(function(name){
      var lower = name.toLowerCase();
      if (lower.indexOf(q)!==0 && lower.indexOf(q)===-1) return;
      if (lower.indexOf(q)===0) starts.push(name); else contains.push(name);
    });
    starts.sort(function(a,b){ return a.localeCompare(b); });
    contains.sort(function(a,b){ return a.localeCompare(b); });
    var matches = starts.concat(contains).slice(0, 30);
    if (matches.length===0){ box.style.display = "none"; box.innerHTML = ""; return; }
    box.innerHTML = matches.map(function(name){
      return '<div class="brand-suggestion" data-name="' + escapeHtml(name) + '" style="padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);">' + escapeHtml(name) + '</div>';
    }).join('');
    box.style.display = "block";
    box.querySelectorAll('.brand-suggestion').forEach(function(item){
      item.addEventListener('mousedown', function(e){
        e.preventDefault();
        var input = document.getElementById('brand-input');
        if (input){ input.value = item.getAttribute('data-name'); }
        box.style.display = "none";
        addBrandChip();
      });
      item.addEventListener('mouseenter', function(){ item.style.background = 'var(--surface-2)'; });
      item.addEventListener('mouseleave', function(){ item.style.background = ''; });
    });
  }

  function renderCategorySuggestions(wrap, query){
    var box = wrap.querySelector('#cat-suggestions');
    if (!box) return;
    var q = (query||"").trim().toLowerCase();
    if (!q){ box.style.display = "none"; box.innerHTML = ""; return; }
    var starts = [], contains = [];
    state.categoryRefs.forEach(function(c){
      var code = (c.code||"").toLowerCase(), desc = (c.description||"").toLowerCase();
      if (code.indexOf(q)!==0 && code.indexOf(q)===-1 && desc.indexOf(q)!==0 && desc.indexOf(q)===-1) return;
      if (code.indexOf(q)===0 || desc.indexOf(q)===0) starts.push(c); else contains.push(c);
    });
    var matches = starts.concat(contains).slice(0, 30);
    if (matches.length===0){ box.style.display = "none"; box.innerHTML = ""; return; }
    box.innerHTML = matches.map(function(c){
      return '<div class="cat-suggestion" data-code="' + escapeHtml(c.code) + '" style="padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);"><strong>' + escapeHtml(c.code) + '</strong> <span style="color:var(--ink-soft);">— ' + escapeHtml(c.description) + '</span></div>';
    }).join('');
    box.style.display = "block";
    box.querySelectorAll('.cat-suggestion').forEach(function(item){
      item.addEventListener('mousedown', function(e){
        e.preventDefault();
        var input = document.getElementById('cat-input');
        if (input){ input.value = item.getAttribute('data-code'); }
        box.style.display = "none";
        addCategoryChip();
      });
      item.addEventListener('mouseenter', function(){ item.style.background = 'var(--surface-2)'; });
      item.addEventListener('mouseleave', function(){ item.style.background = ''; });
    });
  }

  function addBrandChip(){
    var input = document.getElementById('brand-input');
    var wrap = document.getElementById('brand-chips');
    if (!input || !wrap) return;
    var val = input.value.trim();
    if (!val) return;
    var existingVals = Array.from(wrap.querySelectorAll('.cat-chip')).map(function(c){ return c.getAttribute('data-value'); });
    if (existingVals.indexOf(val)!==-1){ input.value=""; return; }
    var chip = document.createElement('span');
    chip.className = 'cat-chip';
    chip.setAttribute('data-value', val);
    chip.innerHTML = '<input type="hidden" name="brands" value="' + escapeHtml(val) + '">' + escapeHtml(val) + '<button type="button" class="chip-x" data-action="remove-brand-chip">×</button>';
    chip.querySelector('[data-action="remove-brand-chip"]').addEventListener('click', handleAction);
    wrap.appendChild(chip);
    input.value = "";
    var box = document.getElementById('brand-suggestions');
    if (box) box.style.display = "none";
    input.focus();
  }

  function addCategoryChip(){
    var input = document.getElementById('cat-input');
    var wrap = document.getElementById('cat-chips');
    if (!input || !wrap) return;
    var val = input.value.trim();
    if (!val) return;
    var existingVals = Array.from(wrap.querySelectorAll('.cat-chip')).map(function(c){ return c.getAttribute('data-value'); });
    if (existingVals.indexOf(val)!==-1){ input.value=""; return; }
    var chip = document.createElement('span');
    chip.className = 'cat-chip';
    chip.setAttribute('data-value', val);
    chip.innerHTML = '<input type="hidden" name="categories" value="' + escapeHtml(val) + '">' + escapeHtml(val) + '<button type="button" class="chip-x" data-action="remove-category-chip">×</button>';
    chip.querySelector('[data-action="remove-category-chip"]').addEventListener('click', handleAction);
    wrap.appendChild(chip);
    input.value = "";
    input.focus();
  }

  // rename-branch uses blur, wire separately since it's an input not a click-only action
  document.addEventListener('blur', function(e){
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute('data-action')==='rename-branch'){
      var id = el.getAttribute('data-id');
      var val = el.value.trim();
      if (val) renameBranch(id, val);
    }
    if (el && el.getAttribute && el.getAttribute('data-action')==='rename-branch-code'){
      var cid = el.getAttribute('data-id');
      setBranchCode(cid, el.value.trim().toUpperCase());
    }
    if (el && el.getAttribute && el.getAttribute('data-action')==='rename-type'){
      var tid = el.getAttribute('data-id');
      var tval = el.value.trim();
      if (tval) renameType(tid, tval);
    }
    if (el && el.getAttribute && el.getAttribute('data-action')==='rename-type-days'){
      setTypeExpiringDays(el.getAttribute('data-id'), el.value);
    }
  }, true);

  // ---------------- boot ----------------
  async function boot(){
    loadLocal();
    await initDb();
    await seedIfEmpty();
    await seedTypesIfEmpty();
    subscribeAll();
    if (localMode){ state.ready = true; isAdminSession = true; render(); }
    try {
      if (window.claude && window.claude.use && !localMode) { assetsApi = await window.claude.use("assets"); }
    } catch(e) { assetsApi = null; }
    try {
      if (window.claude && window.claude.use && !localMode) { downloadsApi = await window.claude.use("downloads"); }
    } catch(e) { downloadsApi = null; }
    try {
      if (window.claude && window.claude.use && !localMode) {
        userApi = await window.claude.use("user");
        if (userApi) {
          var me = await userApi.me();
          myId = me.id;
          isAdminSession = !!(me.isOwner || me.canEdit);
          isOwnerSession = !!me.isOwner;
          if (myId) {
            var myRole = isAdminSession ? "admin" : "viewer";
            try {
              var existing = await dbApi.doc("privileges/"+myId).get();
              if (!existing.exists) {
                await dbApi.doc("privileges/"+myId).set({ role: myRole });
                pendingSelfNamePrompt = true;
              } else {
                var edata = existing.data();
                if (edata.role !== myRole) {
                  await dbApi.doc("privileges/"+myId).update({ role: myRole });
                }
                if (!edata.selfName && !edata.selfNameSkipped) { pendingSelfNamePrompt = true; }
              }
            } catch(e) {}
            try {
              var accessSnap = await dbApi.collection("branchAccess").get();
              for (var ai=0; ai<accessSnap.docs.length; ai++){
                var ad = accessSnap.docs[ai].data();
                if (ad.userId1===myId || ad.userId2===myId){
                  restrictedBranchId = accessSnap.docs[ai].id;
                  break;
                }
              }
              if (restrictedBranchId) {
                state.filters.branch = restrictedBranchId;
                state.archiveFilters.branch = restrictedBranchId;
              }
            } catch(e) {}
          }
          isGlobalAdmin = isAdminSession && !restrictedBranchId;
        } else {
          isAdminSession = false;
          isOwnerSession = false;
          isGlobalAdmin = false;
        }
      }
    } catch(e) { isAdminSession = false; isOwnerSession = false; }
    try {
      if (window.claude && window.claude.use && !localMode) { mcpApi = await window.claude.use("mcp"); }
    } catch(e) { mcpApi = null; }
    if (mcpApi && isGlobalAdmin) { syncFromDrive(true); }
    render();
    if (pendingSelfNamePrompt) { openSelfNameModal(); }
  }
  boot();
})();
</script>
